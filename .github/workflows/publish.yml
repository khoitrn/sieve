name: publish

# Fires on a GitHub Release. Publishes via npm Trusted Publishing (OIDC) —
# no NPM_TOKEN secret stored anywhere. This requires a one-time manual step
# on npmjs.com: package settings -> Trusted Publisher -> GitHub Actions,
# repo "khoitrn/sieve", workflow "publish.yml". Until that's configured,
# this workflow will fail at the publish step with an auth error.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use a provenance-capable npm
        run: npm install -g npm@latest

      - name: Version must match the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag pkg=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag ($GITHUB_REF_NAME) doesn't match package.json version ($pkg) — bump one of them."
            exit 1
          fi

      - name: Validate all skills
        run: node bin/cli.js validate

      - name: Run CLI self-tests
        run: npm test

      - name: Security-scan skill content
        run: node scripts/security-scan.mjs

      - name: Publish with provenance
        run: npm publish --provenance --access public
