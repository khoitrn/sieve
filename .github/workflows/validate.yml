name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate all skills
        run: node bin/cli.js validate
      - name: Run CLI self-tests
        run: npm test
      - name: Check AGENTS.md stays thin
        run: |
          lines=$(wc -l < AGENTS.md)
          echo "AGENTS.md is $lines lines"
          if [ "$lines" -gt 100 ]; then
            echo "AGENTS.md exceeds 100 lines; keep it thin (push detail into referenced files)."
            exit 1
          fi
